name: Release

# Triggers on annotated tags matching `v*`, plus a manual button so we can
# re-run a release without re-tagging (useful when the workflow itself
# needs a fix). Both paths upload assets to the matching GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)build (e.g. v0.8.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write  # required to upload assets to the release

jobs:
  # The tag is typed by hand on a manual run. Expressions are only ever passed
  # to scripts through `env:`, never interpolated into them, so a crafted
  # value cannot run as shell; this check also refuses anything that is not a
  # version tag before a build or an upload uses it.
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but a version tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag such as v0.8.0"
            exit 1
          fi

  ring-server:
    name: Build ring (x86_64-unknown-linux-gnu)
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Per-job cache key (rust-cache appends the job id automatically), so the
      # gnu and musl release builds keep separate caches.
      - uses: Swatinem/rust-cache@v2

      # The dashboard's static build is baked into the Rust binary via
      # rust-embed, so it must exist before `cargo build` runs. Skipping
      # this step would silently ship a binary without any UI assets.
      - uses: oven-sh/setup-bun@v2
      - name: Build dashboard
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build

      # The containerd runtime's gRPC bindings are generated at build time by
      # containerd-client's build script, which needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binary
        run: cargo build --release --bin ring

      - name: Package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PKG="ring-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/ring "dist/${PKG}/"
          cp README.md LICENSE CHANGELOG.md UPGRADE.md "dist/${PKG}/" 2>/dev/null || true
          tar -czf "${PKG}.tar.gz" -C dist "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ring-server
          path: |
            ring-*.tar.gz
            ring-*.tar.gz.sha256

  ring-agent:
    name: Build ring-agent and ring-init (x86_64-unknown-linux-musl)
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Distinct per-job cache (rust-cache appends the job id), keeping the musl
      # target/ artifacts separate from the gnu build above.
      - uses: Swatinem/rust-cache@v2

      # Both run inside guests whose libc Ring knows nothing about (ring-agent
      # in the guest image, ring-init as its initramfs), so they are static
      # binaries — musl is the standard choice.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build release binaries
        run: cargo build --release --target x86_64-unknown-linux-musl -p ring-agent -p ring-init

      - name: Package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for BIN in ring-agent ring-init; do
            PKG="${BIN}-${TAG}-x86_64-unknown-linux-musl"
            mkdir -p "dist/${PKG}"
            cp "target/x86_64-unknown-linux-musl/release/${BIN}" "dist/${PKG}/"
            cp LICENSE "dist/${PKG}/" 2>/dev/null || true
            tar -czf "${PKG}.tar.gz" -C dist "${PKG}"
            sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ring-agent
          path: |
            ring-agent-*.tar.gz
            ring-agent-*.tar.gz.sha256
            ring-init-*.tar.gz
            ring-init-*.tar.gz.sha256

  publish:
    name: Attach to GitHub release
    needs: [ring-server, ring-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar
          # `gh release upload` normally infers the repo from the local git
          # remote, but this job has no checkout (just downloaded artifacts),
          # so we pass --repo explicitly to skip the git lookup.
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            artifacts/**/*.tar.gz artifacts/**/*.tar.gz.sha256
