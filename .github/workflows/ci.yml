name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build
      # Rust-specific cache (tokio/axum/clap all use it): prunes stale target/
      # artifacts, keys on toolchain + Cargo.lock, and adds restore-keys so a
      # Cargo.lock change reuses the closest cache instead of starting cold.
      # save-if keeps PR runs from filling the 10 GB repo quota — only main saves.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  dashboard-lint:
    name: Dashboard Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dashboard deps
        run: cd dashboard && bun install --frozen-lockfile
      - name: Biome (lint + format)
        run: cd dashboard && bun run lint
      - name: svelte-check (types)
        run: cd dashboard && bun run check

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      RING_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: docker pull nginx:alpine
      - run: cargo test

  dashboard-e2e:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build
      - run: docker pull busybox:latest
      - name: Install Chromium
        run: cd dashboard && bunx playwright install --with-deps chromium
      - name: Functional tests
        run: cd dashboard && bun run test:e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: dashboard/test-results
          retention-days: 7

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Caches ~/.cargo/bin (cache-bin defaults to true) so the compiled
      # cargo-audit binary is reused instead of recompiled from scratch each run.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-audit
      # RUSTSEC-2026-0459 (bundled SQLite < 3.54): fixed in libsqlite3-sys 0.39,
      # which no sqlx release accepts yet (sqlx-sqlite 0.9.0 caps it below 0.38).
      # It needs a database and -wal file written by a less trusted party, and
      # Ring only opens its own database in its data directory. Drop the ignore
      # and bump libsqlite3-sys once a sqlx release allows 0.39.
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459
