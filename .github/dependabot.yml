version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "bun"
    directory: "/dashboard"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    ignore:
      # SvelteKit and svelte-check don't support TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "bun"
    directory: "/website"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
