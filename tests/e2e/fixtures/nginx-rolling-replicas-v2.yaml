deployments:
  nginx-rolling-replicas:
    name: nginx-rolling-replicas
    namespace: ring-e2e
    runtime: docker
    image: nginx:1.26-alpine
    replicas: 2
    health_checks:
      - type: tcp
        port: 80
        interval: 2s
        timeout: 1s
        threshold: 2
        on_failure: restart
