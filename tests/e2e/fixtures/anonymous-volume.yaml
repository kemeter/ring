deployments:
  anon-volume:
    name: anon-volume
    namespace: ring-e2e
    runtime: docker
    image: ring-e2e-anon-vol:latest
    replicas: 1
    config:
      # The image is built locally by the test and exists in no registry, so
      # the default `Always` policy would fail the pull.
      image_pull_policy: IfNotPresent
